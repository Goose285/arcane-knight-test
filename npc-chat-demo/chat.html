<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arcane Knight - NPC chat demo</title>
<style>
  :root { --gold:#c89a4a; --ink:#2a1a10; --paper:#f6f0e2; --heart:#ff5a7a; --amber:#ffe14d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#140c06; color:var(--paper); font-family:"Courier New",Courier,monospace; }
  body { max-width:430px; margin:0 auto; position:relative; overflow:hidden; height:100dvh; }
  #scene { position:absolute; inset:0; background:#2c7344 center/cover no-repeat; image-rendering:pixelated; }
  #scene img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; image-rendering:pixelated; }
  .banner { position:absolute; left:10px; right:10px; top:max(10px, env(safe-area-inset-top)); z-index:3;
    background:rgba(20,12,6,.82); border:2px solid var(--gold); border-radius:4px; padding:8px 10px; }
  .banner b { color:var(--amber); letter-spacing:.04em; }
  .banner small { display:block; color:#e7d7b4; margin-top:3px; line-height:1.35; }
  .toggle { display:flex; gap:6px; margin-top:8px; }
  .toggle button, .mem button, .go, .chip, .choice button, .key, .send {
    font-family:inherit; border:2px solid #3a2a18; background:#f6f0e2; color:#2a1a10; border-radius:4px; font-weight:700; }
  .toggle button { flex:1; padding:8px 4px; font-size:12px; }
  .toggle button.on { background:#1c4a2a; color:#e8ffe8; border-color:#7dffa0; }
  .mem { margin-top:6px; font-size:11px; color:#ffe9a0; }
  .mem button { margin:4px 4px 0 0; padding:4px 7px; font-size:11px; background:#3a2414; color:#ffe9a0; border-color:var(--gold); }
  #hero {
    position:absolute; z-index:2; width:28px; height:36px; left:50%; bottom:18%;
    transform:translateX(-50%); image-rendering:pixelated; transition:left .9s linear, bottom .9s linear;
    background:
      linear-gradient(#f4e2a0,#f4e2a0) 8px 0/12px 6px no-repeat,
      linear-gradient(#1a1a1a,#1a1a1a) 10px 6px/8px 4px no-repeat,
      linear-gradient(#f6f1e4,#f6f1e4) 6px 10px/16px 14px no-repeat,
      linear-gradient(#e0b44a,#e0b44a) 12px 14px/4px 4px no-repeat,
      linear-gradient(#c4a06a,#c4a06a) 8px 24px/12px 10px no-repeat;
  }
  #picks { position:absolute; left:0; right:0; bottom:0; z-index:4; display:flex; gap:8px; padding:12px 12px calc(14px + env(safe-area-inset-bottom)); }
  .go { flex:1; padding:12px 6px; font-size:13px; background:#2a1a10; color:#ffe9a0; border-color:var(--gold); }
  #chat { position:absolute; left:0; right:0; bottom:0; top:0; z-index:5; display:none; flex-direction:column; justify-content:flex-end;
    background:linear-gradient(to top, rgba(12,8,4,.55), rgba(12,8,4,.05) 40%, transparent 55%); }
  .panel { margin:8px; background:#2a1a10; border:3px solid var(--gold); box-shadow:4px 4px 0 rgba(0,0,0,.45); border-radius:4px;
    padding:10px; max-height:78dvh; display:flex; flex-direction:column; }
  .who { display:flex; gap:10px; align-items:center; }
  .who img { width:56px; height:56px; image-rendering:pixelated; background:#1a1008; border:2px solid var(--gold); }
  .who .nm { color:var(--amber); font-size:16px; }
  .hearts { letter-spacing:2px; font-size:16px; margin-top:2px; }
  .hearts i { font-style:normal; color:#5a4030; }
  .hearts i.on { color:var(--heart); }
  .log { overflow:auto; margin:8px 0; padding-right:4px; min-height:120px; max-height:34dvh; }
  .bubble { margin:6px 0; padding:8px 10px; border-radius:4px; line-height:1.35; font-size:14px; white-space:pre-wrap; }
  .bubble.npc { background:#f6f0e2; color:#2a1a10; border:2px solid #c89a4a; }
  .bubble.me { background:#1c4a2a; color:#e8ffe8; border:2px solid #7dffa0; margin-left:28px; }
  .typing { color:#ffe9a0; font-size:13px; min-height:18px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 8px; }
  .chip { padding:7px 8px; font-size:12px; }
  .row { display:flex; gap:6px; }
  #box { flex:1; min-height:38px; background:#140c06; color:#f6f0e2; border:2px solid var(--gold); border-radius:4px; padding:8px; font-size:15px; }
  .send { padding:0 12px; background:#1c4a2a; color:#e8ffe8; border-color:#7dffa0; }
  .keys { display:grid; gap:4px; margin-top:8px; }
  .keyrow { display:flex; gap:3px; justify-content:center; }
  .key { flex:1; padding:9px 0; font-size:13px; background:#3a2414; color:#f6f0e2; border-color:#6a4a28; }
  .key.wide { flex:2.2; }
  .choice { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  .choice button { padding:8px 12px; }
  .choice .yes { background:#1c4a2a; color:#e8ffe8; }
  .choice .no { background:#4a1c1c; color:#ffd0d0; }
  .back { margin-top:8px; background:transparent; color:#ffe9a0; border:none; font-family:inherit; font-weight:700; }
  #sheet { position:absolute; inset:0; z-index:8; background:rgba(8,4,2,.72); display:none; align-items:flex-end; }
  #sheet .panel { width:100%; max-height:70dvh; }
  label { display:block; font-size:12px; color:#ffe9a0; margin:8px 0 4px; }
  #nameIn { width:100%; padding:8px; font-family:inherit; font-size:16px; background:#140c06; color:#f6f0e2; border:2px solid var(--gold); }
</style>
</head>
<body>
<div id="scene"><img class="bg" id="bg" alt=""></div>
<div id="hero"></div>
<div class="banner">
  <b>NPC CHAT DEMO</b>
  <small>A look at typed chat. Not in the game. Deferred until after v88.</small>
  <div class="toggle">
    <button id="modeAi" class="on" type="button">AI chat</button>
    <button id="modeOld" type="button">v76 choices</button>
  </div>
  <div class="mem">Memory: <span id="memLine"></span><br><button type="button" id="editMem">Edit what the NPC remembers</button></div>
</div>
<div id="picks"></div>
<div id="chat">
  <div class="panel">
    <div class="who"><img id="portrait" alt=""><div><div class="nm" id="nm"></div><div class="hearts" id="hearts"></div></div></div>
    <div class="log" id="log"></div>
    <div class="typing" id="typing"></div>
    <div id="aiBits">
      <div class="chips" id="chips"></div>
      <div class="row"><div id="box"></div><button class="send" id="send" type="button">Say</button></div>
      <div class="keys" id="keys"></div>
    </div>
    <div id="oldBits" style="display:none"></div>
    <button class="back" id="leave" type="button">Step away</button>
  </div>
</div>
<div id="sheet">
  <div class="panel">
    <div class="nm">Game memory</div>
    <label>Hero name</label>
    <input id="nameIn" maxlength="16" autocomplete="off">
    <label>Quests finished</label>
    <div id="questToggles"></div>
    <label>Bosses slain</label>
    <div id="bossToggles"></div>
    <button class="send" id="memDone" type="button" style="margin-top:10px;padding:10px">Done</button>
  </div>
</div>

    chips:['Hello, Brum','About my quest','The last boss','A gift for the forge'],
    rules:[
      {k:['hello','hi ','hey','morn'], s:m=>'Heat to you, '+m.hero+'. West Street is loud today, but the forge is louder.'},
      {k:['name','who am','who are you'], s:m=>'Brum. I have hammered Oakvale steel since before you were called '+m.hero+'.'},
      {k:['quest','slime','iron','goblin iron','job'], s:m=>m.quests.length?('I heard you finished '+m.quests[0]+'. Good. Bring me what the road still owes you.'):'No finished work on the board yet. Slime Trouble is the gentle start.'},
      {k:['boss','moss','lich','dragon','ember','killed','slew'], s:m=>{ if(m.bosses.length){HEARTS.brum=Math.min(5,HEARTS.brum+1); return m.hero+', you put '+m.bosses[m.bosses.length-1]+' down. The anvil sang when the news came.';} return 'No great beast yet. Do not rush the dragon. Level first, then the north gate.'; }},
      {k:['gift','tongs','coal','present'], s:m=>{m.gifts.push('forge gift'); HEARTS.brum=Math.min(5,HEARTS.brum+1); return 'A gift on the anvil. I will not forget that, '+m.hero+'. The bellows owe you a favor.';}},
      {k:['sword','blade','steel','upgrade','card'], s:'Sharper cards and a truer edge. Talk of the forge is the same as talk of the road: both want a clean strike.'},
      {k:['poker','hold','cards','tavern','mara'], s:'Mara takes the gold I was going to spend on coal. If you sit her table, keep your buy-in small.'},
      {k:['fish','rod','river'], s:'I can spare a rod. The river cattails are thick this season. Cast where the water is quiet.'},
      {k:['night','sleep','inn','rosa'], s:'Rosa keeps a bed. I keep a fire. Between us, Oakvale does not freeze.'},
      {k:['crypt','delve','hollow'], s:'The crypt eats careless steel. Come back with a blade that has seen a grindstone.'},
      {k:['pet','frog','bunny'], s:'A pet underfoot in a forge is a singed pet. Let them wait on the grass.'},
      {k:['thank','love','kind','friend'], s:m=>{HEARTS.brum=Math.min(5,HEARTS.brum+1); return 'Hnh. You have a decent way about you, '+m.hero+'. The furnace agrees.';}},
      {k:['stupid','hate','ugly','shut'], s:()=>{HEARTS.brum=Math.max(0,HEARTS.brum-1); return 'Mind the tongue. The hammer does not like being rushed, and neither do I.';}},
      {k:['bye','farewell','later','leave'], s:m=>'Go on, '+m.hero+'. The road north is colder than this floor.'},
      {k:['gold','coin','price'], s:'Fair prices. I do not cheat a knight who has actually swung the thing.'},
      {k:['oakvale','village','west'], s:'West Street is the forge, the inn, and too many opinions. I only charge for the first.'},
      {k:['heart','friendship','like me'], s:m=>'You stand at a good heat with me, '+m.hero+'. Keep the work honest.'},
      {k:['dragon','dracoryn','castle'], s:'Emberfang sits the throne. My best steel would still think twice.'},
      {k:['help','how','what do'], s:'Tell me a quest, a beast, or a gift. I answer plain.'}
    ],
    fall:[
      m=>'The coals do not know that word, '+m.hero+'. Try the forge, a quest, or the last thing you slew.',
      m=>'Say it again, nearer the point. I am better with iron than with riddles.',
      'The bellows sighed. That usually means I missed the question.'
    ]
  },

    classic:[
      'The inn is warm. The road is not.',
      'A bed until morning puts the day back in order. Your pack stays where you left it.'
    ],
    choice:{ yes:'Take a bed', no:'Keep walking' },
    chips:['The inn is warm','A bed tonight','Have we met?','Any news of bosses?'],
    rules:[
      {k:['hello','hi ','hey','warm'], s:m=>'The inn is warm, '+m.hero+'. The road is not. Come in as far as the mat.'},
      {k:['name','who are'], s:'Rosa. I keep the lamps and the ledger. Both are quieter than the tap.'},
      {k:['bed','sleep','night','rest','morning'], s:m=>'A bed until morning, '+m.hero+'. You will wake with the same gold you trusted me with, less the fee.'},
      {k:['quest','slime','job'], s:m=>m.quests.length?('You look lighter. '+m.quests[0]+' is off your shoulders. The pillow will notice.'):'No finished errand yet. The bed does not mind. Orin might.'},
      {k:['boss','moss','lich','dragon','killed'], s:m=>{ if(m.bosses.length){HEARTS.rosa=Math.min(5,HEARTS.rosa+1); return 'They say '+m.bosses[m.bosses.length-1]+' fell. I will leave a lamp in the window anyway.';} return 'No beast has fallen to your name yet. Sleep before you go looking.'; }},
      {k:['gift','flower','pie','present'], s:()=>{HEARTS.rosa=Math.min(5,HEARTS.rosa+1); MEM.gifts.push('inn gift'); return 'How gentle. I will set it by the ledger, not on the bar.';}},
      {k:['brum','forge','smith'], s:'Brum burns the night on purpose. I only rent it.'},
      {k:['mara','tavern','poker','hold'], s:'Mara shouts. I whisper. If you want cards, her door. If you want quiet, mine.'},
      {k:['save','pack','gold'], s:'What you leave in the chest stays. I have never lost a pack. I have lost a few knights.'},
      {k:['crypt','delve'], s:'Come back dusty if you must. The rugs can be beaten. You cannot.'},
      {k:['thank','kind','friend'], s:()=>{HEARTS.rosa=Math.min(5,HEARTS.rosa+1); return 'You are easy company. That is rarer than a quiet goblin.';}},
      {k:['stupid','hate','shut','rude'], s:()=>{HEARTS.rosa=Math.max(0,HEARTS.rosa-1); return 'The door works in both directions.';}},
      {k:['bye','leave','later'], s:m=>'Walk carefully, '+m.hero+'. The road remembers the cold.'},
      {k:['oakvale','village'], s:'The square, the well, West Street. I keep the part of it that sleeps.'},
      {k:['pet','frog'], s:'Pets may nap by the hearth. Not on the ledger.'},
      {k:['fish','river'], s:'Tobin talks of fish. I talk of blankets. We are both right.'},
      {k:['heart','like me'], s:m=>'You are welcome here, '+m.hero+'. That is the whole of my praise.'},
      {k:['help','how'], s:'Ask for a bed, a quest, or news. I keep the answers short on purpose.'}
    ],
    fall:[
      m=>'I did not catch that, '+m.hero+'. The kettle was louder.',
      'Try again, softer. This is an inn, not the tap.',
      'Mm. Tell me if you want a bed, or news from the road.'
    ]

function hearts(n){ let s=''; for(let i=1;i<=5;i++) s+='<i class="'+(i<=n?'on':'')+'">♥</i>'; return s; }
function memLine(){
  const q=MEM.quests.length?MEM.quests.join(', '):'none';
  const b=MEM.bosses.length?MEM.bosses.join(', '):'none';
  document.getElementById('memLine').textContent = MEM.hero+' · quests: '+q+' · bosses: '+b;
}
function callSay(s){ return typeof s==='function'?s(MEM):s; }
function replyTo(npc, text){
  const t=(' '+text.toLowerCase()+' ');
  for(const r of npc.rules){ if(r.k.some(k=>t.includes(k))) return callSay(r.s); }
  const f=npc.fall[Math.abs(hash(text))%npc.fall.length];
  return callSay(f);
}
function hash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*33+s.charCodeAt(i))|0; return h; }
function addBubble(cls, text){
  const d=document.createElement('div'); d.className='bubble '+cls; d.textContent=text;
  const log=document.getElementById('log'); log.appendChild(d); log.scrollTop=log.scrollHeight;
}
function setChips(list){
  const box=document.getElementById('chips'); box.innerHTML='';
  list.forEach(c=>{ const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=c;
    b.onclick=()=>say(c); box.appendChild(b); });
}
function renderChat(){
  const n=NPC[cur];
  document.getElementById('portrait').src='data:image/png;base64,'+n.face;
  document.getElementById('nm').textContent=n.name;
  document.getElementById('hearts').innerHTML=hearts(HEARTS[cur]);
  document.getElementById('bg').src='data:image/png;base64,'+n.bg;
  document.getElementById('aiBits').style.display = mode==='ai'?'block':'none';
  document.getElementById('oldBits').style.display = mode==='ai'?'none':'block';
}
function openChat(id){
  cur=id; renderChat();
  document.getElementById('log').innerHTML='';
  document.getElementById('chat').style.display='flex';
  document.getElementById('picks').style.display='none';
  document.getElementById('hero').style.display='none';
  if(mode==='ai'){
    document.getElementById('typing').textContent='';
    setChips(NPC[id].chips);
    typeNpc(callSay(NPC[id].rules[0].s));
  } else showClassic(0);
}
function typeNpc(text){
  typing=true; document.getElementById('typing').textContent=NPC[cur].name.split(' ')[0]+' is writing…';
  setTimeout(()=>{ typing=false; document.getElementById('typing').textContent=''; addBubble('npc', text); renderChat(); }, 700);
}
function say(text){
  if(!cur||typing||mode!=='ai') return;
  text=text.trim(); if(!text) return;
  addBubble('me', text);
  document.getElementById('box').textContent='';
  const answer=replyTo(NPC[cur], text);
  const next = text.toLowerCase().includes('bye') ? ['Hello again','One more thing'] : ['Tell me more','What do you remember?','A small gift','I should go'];
  setChips(next);
  typeNpc(answer);
}
function showClassic(i){
  const n=NPC[cur]; const old=document.getElementById('oldBits');
  const last=i>=n.classic.length-1;
  old.innerHTML='<div class="bubble npc"></div>';
  const bub=old.querySelector('.bubble');
  let c=0; const full=n.classic[i];
  const tick=()=>{ c+=2; bub.textContent=full.slice(0,c); if(c<full.length) setTimeout(tick,18); else if(last){
    old.insertAdjacentHTML('beforeend','<div class="choice"><button class="yes" type="button">'+n.choice.yes+'</button><button class="no" type="button">'+n.choice.no+'</button></div>');
    old.querySelector('.yes').onclick=()=>{ addBubble('npc', n.role==='inn'?'The bed is yours until morning.': n.role==='tavern'?'Buy-in is 20 gold. Sit when you are ready.':'The forge counter is open. Look, do not lean on the hot iron.'); };
    old.querySelector('.no').onclick=()=>addBubble('npc','Another time, then.');
  } else {
    const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent='Tap to continue'; b.style.marginTop='8px';
    b.onclick=()=>showClassic(i+1); old.appendChild(b);
  }};
  tick();
}
function walk(id){
  const hero=document.getElementById('hero');
  document.getElementById('bg').src='data:image/png;base64,'+NPC[id].bg;
  hero.style.display='block'; hero.style.left='50%'; hero.style.bottom='8%';
  requestAnimationFrame(()=>{ hero.style.left = id==='brum'?'42%':id==='rosa'?'58%':'48%'; hero.style.bottom='46%'; });
  setTimeout(()=>openChat(id), 950);
}
function keys(){
  const rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  const host=document.getElementById('keys');
  rows.forEach(r=>{
    const d=document.createElement('div'); d.className='keyrow';
    for(const ch of r){ const b=document.createElement('button'); b.className='key'; b.type='button'; b.textContent=ch;
      b.onclick=()=>{ document.getElementById('box').textContent += ch.toLowerCase(); }; d.appendChild(b); }
    host.appendChild(d);
  });
  const last=document.createElement('div'); last.className='keyrow';
  const space=document.createElement('button'); space.className='key wide'; space.type='button'; space.textContent='space';
  space.onclick=()=>{ document.getElementById('box').textContent += ' '; };
  const bk=document.createElement('button'); bk.className='key'; bk.type='button'; bk.textContent='del';
  bk.onclick=()=>{ const t=document.getElementById('box').textContent; document.getElementById('box').textContent=t.slice(0,-1); };
  last.append(space,bk); host.appendChild(last);
}
function buildPicks(){
  const p=document.getElementById('picks');
  [['brum','Brum, West St'],['rosa','Rosa, the inn'],['mara','Mara, the Tap']].forEach(([id,label])=>{
    const b=document.createElement('button'); b.className='go'; b.type='button'; b.textContent=label; b.onclick=()=>walk(id); p.appendChild(b);
  });
}
function buildSheet(){
  const q=document.getElementById('questToggles'), b=document.getElementById('bossToggles');
  ALLQ.forEach(name=>{ const btn=document.createElement('button'); btn.type='button'; btn.textContent=name;
    const paint=()=>{ btn.style.outline = MEM.quests.includes(name)?'2px solid #7dffa0':'none'; };
    btn.onclick=()=>{ const i=MEM.quests.indexOf(name); if(i>=0) MEM.quests.splice(i,1); else MEM.quests.push(name); paint(); memLine(); };
    paint(); q.appendChild(btn); });
  ALLB.forEach(name=>{ const btn=document.createElement('button'); btn.type='button'; btn.textContent=name;
    const paint=()=>{ btn.style.outline = MEM.bosses.includes(name)?'2px solid #7dffa0':'none'; };
    btn.onclick=()=>{ const i=MEM.bosses.indexOf(name); if(i>=0) MEM.bosses.splice(i,1); else MEM.bosses.push(name); paint(); memLine(); };
    paint(); b.appendChild(btn); });
}
